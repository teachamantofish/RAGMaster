<section>
  <form id="source-form">
    <div class="config-form-container">
      <div class="config-form-column config-form-column--controls">
        <div class="config-form-panel-label">Run settings</div>
        <div class="config-action-buttons">
          <sl-button variant="primary" id="source-save-btn"><sl-icon name="floppy"></sl-icon></sl-button>
          <sl-button variant="primary" id="source-reload-btn"><sl-icon name="arrow-clockwise"></sl-icon></sl-button>
        </div>

        <div class="config-field"><sl-input id="source-cwd" label="Run Directory (CWD)" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-log-dir" label="Log Directory" type="text"></sl-input></div>

        <div class="section-divider"><hr><span>Metadata</span><hr></div>
        <div class="config-field"><sl-input id="source-id" label="ID" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-parser" label="Parser" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-crawl-url" label="Crawl URL" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-base-dir" label="Base Directory" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-metadata-title" label="Title" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-metadata-author" label="Author" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-metadata-category" label="Category" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-metadata-description" label="Description" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-tags" label="Tags" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-metadata-date" label="Metadata Date" type="text"></sl-input></div>
        <div class="config-field"><sl-input id="source-pages" label="Pages" type="text"></sl-input></div>

        <sl-textarea id="source-status-display" class="config-status-display" label="Notes" placeholder="Configuration notes will appear here" readonly resize="none" rows="3"></sl-textarea>
      </div>

      <div class="config-form-column config-form-column--viewer">
        <div class="config-form-panel-label">File reader</div>
        <div class="fields"><sl-textarea id="source-config-viewer" class="config-file-viewer" resize="auto" placeholder="Loading file..."></sl-textarea></div>
      </div>
    </div>
  </form>
</section>
